<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">System readout: het patel, computer engineering student</title>
  <desc id="d">A neofetch-style panel listing languages, systems, tests and tooling, with animated bars for language bytes across all public repositories.</desc>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6fff4"/>
      <stop offset="0.6" stop-color="#2ee88a"/>
      <stop offset="1" stop-color="#34d8ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7fffd4" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee88a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2ee88a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="58"/></filter>
    <clipPath id="panelClip"><rect x="30" y="24" width="1140" height="512" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="560" fill="#04070c"/>
  <rect width="1200" height="560" fill="url(#grid)"/>


  <rect x="30" y="24" width="1140" height="512" rx="16" fill="#060b12" stroke="#16303a" stroke-width="1.2"/>
  <circle cx="150" cy="60" r="280" fill="url(#glowA)" filter="url(#soft)" clip-path="url(#panelClip)" opacity="0.8"/>
  <text x="56" y="66" fill="#2ee88a" font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="15">$ neofetch --off</text>
  <text x="1146" y="66" fill="#465c6e" font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="12" text-anchor="end">fig.02 / machine readable</text>
  <path d="M30 86H1170" stroke="#ffffff" stroke-opacity="0.07"/>

  <text x="64" y="160" fill="url(#name)" font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="44" font-weight="600" letter-spacing="-1">het patel</text>
  <text x="64" y="194" fill="#2ee88a" font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="16">computer engineering student</text>
  <path d="M64 216H430" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3 5"/>
  <g font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#7f97a9">
    <text x="64" y="244">gandhinagar, in · utc+5:30</text>
    <text x="64" y="268">computer engineering · still a student</text>
  </g>

  <g font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
    <rect x="64" y="292" width="212" height="30" rx="15" fill="#0a1a14" stroke="#2ee88a" stroke-opacity="0.4"/>
    <circle cx="84" cy="307" r="3.5" fill="#2ee88a">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="98" y="312" fill="#2ee88a" font-size="12.5">open to internships</text>
  </g>

  <g font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace" letter-spacing="0.2">
    <text x="520" y="128" fill="#465c6e" font-size="13">langs</text>
    <text x="620" y="128" fill="#d6e7f3" font-size="13.5">Python · TypeScript · C# (learning)</text>
    <text x="520" y="155" fill="#465c6e" font-size="13">systems</text>
    <text x="620" y="155" fill="#d6e7f3" font-size="13.5">PaceGuard · ChannelTruth · AdSentry</text>
    <text x="520" y="182" fill="#465c6e" font-size="13">repos</text>
    <text x="620" y="182" fill="#d6e7f3" font-size="13.5">9 public · 3 shipped · 1 ML team build</text>
    <text x="520" y="209" fill="#465c6e" font-size="13">tests</text>
    <text x="620" y="209" fill="#d6e7f3" font-size="13.5">187 passing · no database mocks</text>
    <text x="520" y="236" fill="#465c6e" font-size="13">ci</text>
    <text x="620" y="236" fill="#d6e7f3" font-size="13.5">4 workflows · py3.11 + py3.12 + smoke</text>
    <text x="520" y="263" fill="#465c6e" font-size="13">ui</text>
    <text x="620" y="263" fill="#d6e7f3" font-size="13.5">Vue 3 · React · plain ES modules</text>
    <text x="520" y="290" fill="#465c6e" font-size="13">data</text>
    <text x="620" y="290" fill="#d6e7f3" font-size="13.5">SQL Server DDL · SQLite demo store</text>
    <text x="520" y="317" fill="#465c6e" font-size="13">tools</text>
    <text x="620" y="317" fill="#d6e7f3" font-size="13.5">git · docker · pytest · playwright · gh</text>
  </g>

  <path d="M64 340H1136" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="64" y="356" fill="#465c6e" font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11.5" letter-spacing="1.4">LANGUAGE BYTES · ALL PUBLIC REPOS</text>

  <g font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
    <text x="64" y="376" fill="#7f97a9" font-size="12">python</text>
    <rect x="176" y="364" width="640" height="10" rx="5" fill="#0d1620"/>
    <rect x="176" y="364" width="0" height="10" rx="5" fill="#2ee88a" fill-opacity="0.85">
      <animate attributeName="width" to="576" dur="1.1s" begin="0.60s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="836" y="376" fill="#465c6e" font-size="12">31.5%</text>
  </g>
  <g font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
    <text x="64" y="402" fill="#7f97a9" font-size="12">typescript</text>
    <rect x="176" y="390" width="640" height="10" rx="5" fill="#0d1620"/>
    <rect x="176" y="390" width="0" height="10" rx="5" fill="#34d8ff" fill-opacity="0.85">
      <animate attributeName="width" to="530" dur="1.1s" begin="0.74s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="836" y="402" fill="#465c6e" font-size="12">29.0%</text>
  </g>
  <g font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
    <text x="64" y="428" fill="#7f97a9" font-size="12">html</text>
    <rect x="176" y="416" width="640" height="10" rx="5" fill="#0d1620"/>
    <rect x="176" y="416" width="0" height="10" rx="5" fill="#6ea8ff" fill-opacity="0.85">
      <animate attributeName="width" to="479" dur="1.1s" begin="0.88s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="836" y="428" fill="#465c6e" font-size="12">26.2%</text>
  </g>
  <g font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
    <text x="64" y="454" fill="#7f97a9" font-size="12">css</text>
    <rect x="176" y="442" width="640" height="10" rx="5" fill="#0d1620"/>
    <rect x="176" y="442" width="0" height="10" rx="5" fill="#a78bfa" fill-opacity="0.85">
      <animate attributeName="width" to="132" dur="1.1s" begin="1.02s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="836" y="454" fill="#465c6e" font-size="12">7.2%</text>
  </g>
  <g font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
    <text x="64" y="480" fill="#7f97a9" font-size="12">javascript</text>
    <rect x="176" y="468" width="640" height="10" rx="5" fill="#0d1620"/>
    <rect x="176" y="468" width="0" height="10" rx="5" fill="#ffc45c" fill-opacity="0.85">
      <animate attributeName="width" to="95" dur="1.1s" begin="1.16s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="836" y="480" fill="#465c6e" font-size="12">5.2%</text>
  </g>

  <text x="64" y="516" fill="#3b5164" font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11.5">github.com/het12779-ui · measured, not claimed</text>
  <text x="1146" y="516" fill="#3b5164" font-family="Consolas, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11.5" text-anchor="end">utf-8 · lf · no build step</text>
</svg>
